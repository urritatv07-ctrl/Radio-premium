
name: Crear Radio Premium APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descomprimir proyecto
        run: |
          if [ ! -f "Radio_Premium_Proyecto_Android.zip" ]; then
            echo "::error::No se encontró el archivo ZIP."
            exit 1
          fi

          rm -rf proyecto
          mkdir -p proyecto
          unzip -o Radio_Premium_Proyecto_Android.zip -d proyecto

      - name: Detectar proyecto Android
        id: android
        run: |
          SETTINGS=$(find proyecto -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) | head -n 1)

          if [ -n "$SETTINGS" ]; then
            DIR=$(dirname "$SETTINGS")
          else
            BUILD=$(find proyecto -type f \( \
              -name build.gradle \
              -o -name build.gradle.kts \
            \) | head -n 1)

            if [ -z "$BUILD" ]; then
              echo "::error::No se encontró build.gradle."
              exit 1
            fi

            DIR=$(dirname "$BUILD")
          fi

          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto: $DIR"

      - name: Crear Gradle Wrapper si falta
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Generando Gradle Wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Compilar Radio Premium
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: |
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Buscar APK
        run: |
          mkdir -p apk-final

          find proyecto -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -exec cp {} apk-final/ \;

          if [ -z "$(find apk-final -name '*.apk' -type f)" ]; then
            echo "::error::No se generó el APK."
            exit 1
          fi

          ls -lh apk-final/

      - name: Descargar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Premium-APK
          path: apk-final/*.apk
          if-no-files-found: error
          retention-days: 14
