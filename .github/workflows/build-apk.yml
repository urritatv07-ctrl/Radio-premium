
name: Crear Radio Premium APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descomprimir proyecto
        run: |
          unzip -o Radio_Premium_Proyecto_Android.zip -d proyecto

      - name: Localizar proyecto Android
        id: android
        run: |
          DIR=$(find proyecto -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit | xargs dirname)

          if [ -z "$DIR" ] || [ "$DIR" = "." ]; then
            echo "::error::No se encontró la raíz Android."
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p apk-final

          find proyecto -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} apk-final/ \;

          if ! ls apk-final/*.apk >/dev/null 2>&1; then
            echo "::error::No se encontró el APK."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Premium-APK
          path: apk-final/*.apk
          if-no-files-found: error
          retention-days: 14
