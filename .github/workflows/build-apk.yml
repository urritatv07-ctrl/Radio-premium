name: Compilar Radio APK

on:
  push:
    branches: [ "main" ] # Cambia a "master" si tu rama principal se llama así
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Otorgar permisos de ejecución a Gradle
      run: chmod +x ./gradlew

    - name: Compilar APK (Modo Debug)
      run: ./gradlew assembleDebug

    - name: Guardar APK como artefacto
      uses: actions/artifacts@v4
      with:
        name: radio-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
concurrency: 
