name: Crear Radio Premium APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto Android
        run: |
          if [ ! -f "Radio_Premium_Proyecto_Android.zip" ]; then
            echo "::error::No se encontró Radio_Premium_Proyecto_Android.zip"
            exit 1
          fi

          rm -rf proyecto
          mkdir -p proyecto
          unzip -o Radio_Premium_Proyecto_Android.zip -d proyecto

      - name: Localizar proyecto Android
        id: android
        run: |
          SETTINGS=$(find proyecto -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto Android encontrado en: $DIR"

      - name: Compilar APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Buscar APK generado
        run: |
          mkdir -p apk-final

          find proyecto -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} apk-final/ \;

          if ! ls apk-final/*.apk >/dev/null 2>&1; then
            echo "::error::La compilación terminó sin generar un APK."
            exit 1
          fi

          ls -lh apk-final/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Premium-APK
          path: apk-final/*.apk
          if-no-files-found: error
          retention-days: 14
