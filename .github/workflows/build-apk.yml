name: Crear Radio Premium APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Descomprimir proyecto
        run: |
          if [ ! -f "Radio_Premium_Proyecto_Android.zip" ]; then
            echo "❌ ERROR: No se encontró el archivo 'Radio_Premium_Proyecto_Android.zip' en la raíz."
            exit 1
          fi
          rm -rf proyecto
          unzip -o Radio_Premium_Proyecto_Android.zip -d proyecto

      - name: Compilar APK
        run: |
          # Encuentra automáticamente la raíz donde está el build.gradle principal
          GRADLE_DIR=$(find proyecto -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          
          if [ -z "$GRADLE_DIR" ]; then
            echo "❌ ERROR: No se encontró ningún archivo build.gradle dentro del ZIP."
            exit 1
          fi
          
          cd "$GRADLE_DIR"
          
          # Corrige permisos de ejecución de scripts y genera wrapper si falta
          if [ ! -f "./gradlew" ]; then
            echo "-> Creando Gradle Wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew
          
          # Compilación limpia
          ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Premium-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
