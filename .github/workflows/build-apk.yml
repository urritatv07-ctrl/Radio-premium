name: Crear Radio Premium APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Descomprimir proyecto
        run: |
          ls -lh
          if [ ! -f "Radio_Premium_Proyecto_Android.zip" ]; then
            echo "ERROR: No está el zip en la raíz del repo"
            echo "Sube el zip con ese nombre exacto"
            exit 1
          fi
          rm -rf proyecto
          unzip -o Radio_Premium_Proyecto_Android.zip -d proyecto
          find proyecto -maxdepth 3 -type f

      - name: Compilar APK
        run: |
          cd proyecto
          # Si hay gradlew lo usa, si no, usa gradle del sistema
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "app/gradlew" ]; then
            chmod +x app/gradlew
            cd app && ./gradlew assembleDebug --stacktrace
          else
            echo "No hay gradlew, compilando con gradle global"
            # Crea wrapper temporal si falta
            gradle wrapper --gradle-version 8.7
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Premium-APK
          path: |
            proyecto/app/build/outputs/apk/debug/*.apk
            proyecto/**/build/outputs/apk/debug/*.apk
            proyecto/build/outputs/apk/debug/*.apk
