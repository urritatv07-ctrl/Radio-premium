      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto
        run: |
          mkdir -p proyecto
          unzip -o Radio_Premium_Proyecto_Android.zip -d proyecto
          find proyecto -type f | head -50

      - name: Compilar APK
        run: |
          cd proyecto
          GRADLE_FILE=$(find . -name gradlew -type f | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "No se encontró gradlew dentro del ZIP"
            exit 1
          fi
          cd "$(dirname "$GRADLE_FILE")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Premium-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
